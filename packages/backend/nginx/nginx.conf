# ============================================================
# Nginx 配置 - 前后端完全分离架构
# ============================================================
# 架构说明：
#   - 前端静态文件由 Nginx 直接服务（root /usr/share/nginx/html）
#   - API 请求反向代理到后端 Express 服务（xiaomeng:3000）
#   - WebSocket 请求代理到流式服务（xiaomeng:8080）
#   - SPA 路由回退：try_files 确保前端路由正常工作
#
# 部署说明：
#   - 前端构建产物通过 docker-compose 挂载到 /usr/share/nginx/html
#   - 源路径：packages/frontend/dist → 容器内 /usr/share/nginx/html
#   - 后端不再托管前端静态资源，实现完全分离
# ============================================================

events {
    worker_connections 1024;
}

http {
    /** 后端 API 服务上游（Express，端口 3000） */
    upstream xiaomeng_backend {
        server xiaomeng:3000;
    }

    /** WebSocket 流式服务上游（端口 8080） */
    upstream xiaomeng_ws {
        server xiaomeng:8080;
    }

    # HTTP 服务器
    server {
        listen 80;
        server_name localhost;

        # 客户端最大请求体大小（用于音频上传）
    client_max_body_size 10M;

        # ============================================================
        # 前端静态文件服务（由 Nginx 直接提供，不经过后端）
        # root 指向前端构建产物目录，SPA 路由通过 try_files 回退到 index.html
        # 安全说明：前端资源与后端 API 完全隔离，后端无法被直接访问静态文件
        # ============================================================
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ============================================================
        # API 请求反向代理到后端
        # 仅 /api/ 路径转发，后端只处理业务逻辑
        # ============================================================
     location /api/ {
            proxy_pass http://xiaomeng_backend;
          proxy_http_version 1.1;
            proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================================
        # 健康检查端点（直接代理到后端，不记录访问日志）
        # ============================================================
        location /health {
       proxy_pass http://xiaomeng_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
       access_log off;
        }

        # ============================================================
        # WebSocket 代理（流式模式，支持长连接）
        # 超时设置为 7 天，避免长时间推送被断开
        # ============================================================
        location /ws {
         proxy_pass http://xiaomeng_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket 超时设置
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        }
    }
